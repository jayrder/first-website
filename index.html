
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">
        <h1>My Task Manager</h1>

        <div class="task-input">
            <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
            onkeydown="handleEnter(event)"
        >
        <input
    type="date"
    id="taskDate"
>
            <button onclick="addTask()">Add Task</button>
        </div>

        <p id="taskCounter">0 tasks remaining</p>
        <input
    type="text"
    id="searchInput"
    placeholder="Search tasks..."
    oninput="searchTasks()"
>

        <div class="filters">
            <button onclick="setFilter('all')">All</button>
            <button onclick="setFilter('active')">Active</button>
            <button onclick="setFilter('completed')">Completed</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        let savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];

        // Make sure every task has a true/false completed value.
        let tasks = savedTasks.map(function(task) {
            return {
                text: task.text,
                completed: task.completed === true
            };
        });

        let currentFilter = "all";
        let searchText = "";

        function handleEnter(event) {
    if (event.key === "Enter") {
        addTask();
    }
}
        
function searchTasks() {
    const searchInput = document.getElementById("searchInput");

    searchText = searchInput.value.toLowerCase();

    displayTasks();
}
    function displayTasks() {

            const taskList = document.getElementById("taskList");
            const taskCounter = document.getElementById("taskCounter");

            taskList.innerHTML = "";


            // Count unfinished tasks
            const remainingTasks = tasks.filter(function(task) {
                return task.completed === false;
            }).length;

            taskCounter.textContent =
                remainingTasks + " tasks remaining";


            // Decide which tasks to display
            let visibleTasks = tasks;
            if (searchText !== "") {
    visibleTasks = visibleTasks.filter(function(task) {
        return task.text.toLowerCase().includes(searchText);
    });
}

            if (currentFilter === "active") {

                visibleTasks = tasks.filter(function(task) {
                    return task.completed === false;
                });

            }

            if (currentFilter === "completed") {

                visibleTasks = tasks.filter(function(task) {
                    return task.completed === true;
                });

            }


            // Display the selected tasks
            visibleTasks.forEach(function(task) {

                const taskElement = document.createElement("li");

                const taskText = document.createElement("span");

                taskText.textContent = task.text;
               
               
                if (task.dueDate) {
    const dateText = document.createElement("small");
    dateText.textContent = "Due: " + task.dueDate;
    taskElement.appendChild(dateText);
}

                // Show completed tasks with a line through them
                if (task.completed === true) {
                    taskElement.classList.add("completed");
                }


                // Click task to complete/uncomplete it
                taskText.onclick = function() {

const taskIndex = tasks.indexOf(task);

if (taskIndex !== -1) {
    tasks[taskIndex].completed =
        !tasks[taskIndex].completed;

    saveTasks();

    displayTasks();
}
};


                // Create Remove button
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Remove";


                deleteButton.onclick = function(event) {

                    event.stopPropagation();

                    tasks = tasks.filter(function(item) {
                        return item !== task;
                    });

                    saveTasks();

                    displayTasks();
                };


                taskElement.appendChild(taskText);

                taskElement.appendChild(deleteButton);

                taskList.appendChild(taskElement);

            });
        }


       
function addTask() {

    const input = document.getElementById("taskInput");
    const taskText = input.value.trim();

    const dateInput = document.getElementById("taskDate");
    const dueDate = dateInput.value;

    if (taskText === "") {
        return;
    }

    tasks.push({
        text: taskText,
        dueDate: dueDate,
        completed: false
    });

    input.value = "";
    dateInput.value = "";

    saveTasks();
    displayTasks();
}




        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );
        }


        function setFilter(filter) {

            currentFilter = filter;

            displayTasks();
        }


        // Start the application
        displayTasks();

    </script>

</body>
</html>
