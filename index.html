<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>My Task Manager</h1>

        <div class="task-input">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                onkeydown="handleEnter(event)"
            >

            <input
                type="date"
                id="taskDate"
            >

            <button onclick="addTask()">Add Task</button>

        </div>

        <p id="taskCounter">0 tasks remaining</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search tasks..."
            oninput="searchTasks()"
        >

        <div class="filters">
            <button onclick="setFilter('all')">All</button>
            <button onclick="setFilter('active')">Active</button>
            <button onclick="setFilter('completed')">Completed</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script>

        let savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];

        let tasks = savedTasks.map(function(task) {
            return {
                text: task.text || "",
                dueDate: task.dueDate || "",
                completed: task.completed === true
            };
        });

        let currentFilter = "all";
        let searchText = "";


        // Check whether a task is overdue.
        function isOverdue(task) {

            if (!task.dueDate || task.completed) {
                return false;
            }

            // Get today's date in YYYY-MM-DD format.
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            const todayString = `${year}-${month}-${day}`;

            return task.dueDate < todayString;
        }


        function handleEnter(event) {

            if (event.key === "Enter") {
                addTask();
            }

        }


        function searchTasks() {

            const searchInput = document.getElementById("searchInput");

            searchText = searchInput.value.toLowerCase().trim();

            displayTasks();

        }


        function displayTasks() {

            const taskList = document.getElementById("taskList");
            const taskCounter = document.getElementById("taskCounter");

            taskList.innerHTML = "";


            const remainingTasks = tasks.filter(function(task) {
                return task.completed === false;
            }).length;


            taskCounter.textContent =
                remainingTasks + " tasks remaining";


            let visibleTasks = tasks;


            // Apply task filter.
            if (currentFilter === "active") {

                visibleTasks = visibleTasks.filter(function(task) {
                    return task.completed === false;
                });

            }

            if (currentFilter === "completed") {

                visibleTasks = visibleTasks.filter(function(task) {
                    return task.completed === true;
                });

            }


            // Apply search.
            if (searchText !== "") {

                visibleTasks = visibleTasks.filter(function(task) {

                    return task.text
                        .toLowerCase()
                        .includes(searchText);

                });

            }


            // Display tasks.
            visibleTasks.forEach(function(task) {

                const taskElement = document.createElement("li");

                const taskContent = document.createElement("div");
                taskContent.classList.add("task-content");


                const taskText = document.createElement("span");

                taskText.textContent = task.text;


                if (task.completed === true) {
                    taskElement.classList.add("completed");
                }


                // Display due date.
                if (task.dueDate) {

                    const dateText = document.createElement("small");

                    if (isOverdue(task)) {

                        dateText.textContent =
                            "OVERDUE — Due: " + task.dueDate;

                        taskElement.classList.add("overdue");

                    } else {

                        dateText.textContent =
                            "Due: " + task.dueDate;

                    }

                    taskContent.appendChild(dateText);

                }


                taskContent.appendChild(taskText);


                // Complete/uncomplete task.
                taskText.onclick = function() {

                    const taskIndex = tasks.indexOf(task);

                    if (taskIndex !== -1) {

                        tasks[taskIndex].completed =
                            !tasks[taskIndex].completed;

                        saveTasks();

                        displayTasks();

                    }

                };


                // Remove button.
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Remove";


                deleteButton.onclick = function(event) {

                    event.stopPropagation();

                    tasks = tasks.filter(function(item) {
                        return item !== task;
                    });

                    saveTasks();

                    displayTasks();

                };


                taskElement.appendChild(taskContent);
                taskElement.appendChild(deleteButton);

                taskList.appendChild(taskElement);

            });

        }


        function addTask() {

            const input = document.getElementById("taskInput");

            const taskText = input.value.trim();


            const dateInput = document.getElementById("taskDate");

            const dueDate = dateInput.value;


            if (taskText === "") {
                return;
            }


            tasks.push({

                text: taskText,

                dueDate: dueDate,

                completed: false

            });


            input.value = "";
            dateInput.value = "";


            saveTasks();
            displayTasks();

        }


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        function setFilter(filter) {

            currentFilter = filter;

            displayTasks();

        }


        // Start application.
        displayTasks();

    </script>

</body>

</html>
